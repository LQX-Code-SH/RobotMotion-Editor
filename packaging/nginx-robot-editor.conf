# 前端静态站点（生产构建产物）— 固定 3000 端口
#
# 安装：
#   sudo cp packaging/nginx-robot-editor.conf /etc/nginx/sites-available/robot-editor.conf
#   sudo ln -sf /etc/nginx/sites-available/robot-editor.conf /etc/nginx/sites-enabled/robot-editor.conf
#   sudo nginx -t && sudo systemctl enable --now nginx
#
# 发布（构建 + 同步）：
#   scripts/deploy-web.sh
#
# 说明：
#   - 站点根目录 /var/www/robot-editor 由 www-data 读取（/home/nvidia 是 750，nginx 进不去）；
#   - COOP/COEP 必须保留，否则 USD(WASM) 无法启用 SharedArrayBuffer；
#   - 这里刻意不用 location 级 add_header，避免 nginx 的 add_header 继承失效把 COOP/COEP 丢掉。

server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /var/www/robot-editor;
    index index.html;

    # USD / WASM 需要跨源隔离
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    charset utf-8;
    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/wasm image/svg+xml;

    # 带 hash 的打包资源：长缓存
    location /assets/ {
        expires 30d;
        access_log off;
    }

    # 机型资源（约 400MB，变动少）
    location /robot/ {
        expires 7d;
        access_log off;
    }

    # USD 查看器（含 .wasm）
    location /usd-viewer/ {
        expires 7d;
        access_log off;
    }

    # 单页应用：入口不缓存，其余回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
        expires epoch;
    }

    access_log /var/log/nginx/robot-editor.access.log;
    error_log  /var/log/nginx/robot-editor.error.log warn;
}

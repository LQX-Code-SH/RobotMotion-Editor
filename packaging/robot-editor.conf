# robot-editor 配置（安装后位置：/etc/robot-editor/bridge.conf）
# 改完执行：sudo robot-editor restart
# 语法为 sh：值不要加引号以外的空格；等号两侧不能有空格。

# ---- ROS 2 环境（冒号分隔，按顺序 source；不存在的项会被跳过）----
# 真机固件通过 ROS 2 话题控制，必须指向机器人实际的 setup.bash。
ROS_SETUP=/opt/ros/jazzy/setup.bash:/opt/humanoid/install/setup.bash:/home/nvidia/xos/setup.bash

# ---- 机型 ----
BRIDGE_MODEL=walker-tienkung-dex
# 显示名（留空则用默认名）
BRIDGE_NAME=

# ---- 端口 ----
# 控制通道（网页连接用这个）
WS_PORT=8081
# 状态通道（遥测 20Hz）
STATUS_PORT=8082
# 相机通道（0 = 禁用）
CAMERA_PORT=8083
# UDP 设备发现信标
BEACON_PORT=45678

# ---- 灵巧手 ----
# auto | brainco | inspire | none
BRIDGE_HAND=inspire

# ---- 驱动参数（务必与现场安全边界一致）----
# 驱动侧速度参数 rad/s
BRIDGE_SPD=1.5
# 驱动侧电流限幅 A（头和腰建议 40）
BRIDGE_CUR=40
# 桥接侧目标斜坡上限 rad/s（略高于 BRIDGE_SPD 即可）
BRIDGE_MAX_SPEED=3.0

# ---- 附加开关（留空则不加；多个用空格分隔）----
# --trace：在 status 里附带原始关节目标，用于排查跟踪误差（只读）
BRIDGE_EXTRA=--trace
